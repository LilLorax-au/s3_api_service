# Spring config
spring.application.name=s3_api_service
spring.jpa.hibernate.dll-auto=update
spring.jpa.show-sql=true

# Spring is not liking this + isn't required now
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# S3 secrets
s3.access=${API_ACCESS_KEY:cheese}
s3.sec=${API_ACCESS_SEC:cheese}
s3.name=${S3_NAME:cheese}
s3.zone=${API_ZONE:cheese}

# SQL secrets
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER: none}
spring.datasource.password=${DB_PASSWORD: none}

# ref: https://spring.io/guides/gs/accessing-data-mysql